databases:
  - name: smartspend-db
    databaseName: smartspend
    plan: free

services:
  - type: web
    name: smartspend-api
    repo: https://github.com/ThatiSreeja/smartspend-app
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && gunicorn -w 2 -b 0.0.0.0:$PORT run:app
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      - key: DATABASE_URL
        fromDatabase:
          name: smartspend-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FRONTEND_ORIGIN
        fromService:
          name: smartspend
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: AUTO_CREATE_TABLES
        value: "true"

  - type: web
    name: smartspend
    repo: https://github.com/ThatiSreeja/smartspend-app
    runtime: static
    buildCommand: cd frontend && export npm_config_script_shell=/bin/sh && npm ci && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_RENDER_API_ORIGIN
        fromService:
          name: smartspend-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
