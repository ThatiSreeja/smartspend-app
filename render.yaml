services:
  - type: web
    name: smartspend-api
    repo: https://github.com/ThatiSreeja/smartspend-app
    branch: master
    runtime: python
    plan: starter
    autoDeployTrigger: "off"
    buildCommand: python -m pip install -r backend/requirements.txt
    preDeployCommand: cd backend && python -m flask --app run db upgrade
    startCommand: cd backend && gunicorn --workers 2 --threads 2 --bind 0.0.0.0:$PORT run:app
    healthCheckPath: /api/ready
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.18
      - key: SMARTSPEND_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: RATELIMIT_STORAGE_URI
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FRONTEND_ORIGIN
        fromService:
          name: smartspend
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: AUTO_CREATE_TABLES
        value: "false"
      - key: AI_SHARE_FINANCIAL_SUMMARIES
        value: "false"

  - type: web
    name: smartspend
    repo: https://github.com/ThatiSreeja/smartspend-app
    branch: master
    runtime: static
    autoDeployTrigger: "off"
    buildCommand: test -n "$VITE_RENDER_API_ORIGIN" && cd frontend && export npm_config_script_shell=/bin/sh && npm ci --include=dev && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'"
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    envVars:
      - key: NODE_VERSION
        value: "~22"
      - key: VITE_RENDER_API_ORIGIN
        fromService:
          name: smartspend-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
